<!doctype html>
<!-- The 1200x630 link-preview card (images/og.png). Render: screenshot this page at 1200x630, DPR 1, after fonts load. -->
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<style>
@font-face { font-family: 'Archivo'; src: url('../fonts/Archivo.woff2') format('woff2'); font-weight: 700 900; font-stretch: 100% 125%; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0B0B0C; }
.card { box-sizing: border-box; width: 1200px; height: 630px; padding: 70px 72px 0; position: relative; overflow: hidden; }
/* the homepage h1 */
h1 { font: 900 88px/.93 'Archivo', 'Arial Black', sans-serif; font-stretch: 118%; letter-spacing: -.015em; color: #F3F3EF; margin: 0; max-width: 16ch; text-wrap: balance; }
/* the footer wordmark: spans the content width (8.25 font sizes), the site's --bg-3 */
.word { position: absolute; left: 72px; right: 72px; bottom: 34px; font: 900 128px/.8 'Archivo', 'Arial Black', sans-serif; font-size: calc(1056px / 8.25); font-stretch: 125%; letter-spacing: -.04em; color: #1F1F22; white-space: nowrap; }
.mark { position: absolute; top: 74px; right: 72px; width: 128px; height: 128px; }
</style></head>
<body><div class="card">
  <h1>Open-source hardware and software for linear motion machines</h1>
  <div class="word">OpenValence</div>
  <img class="mark" src="../mark.svg" alt="">
</div></body>
</html>
