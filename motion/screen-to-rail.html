<!doctype html>
<html lang="en" data-composition-variables='[{"id":"theme","type":"string","label":"Theme","default":"dark"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<meta name="robots" content="noindex">
<title>Screen to rail</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<!-- Screen to rail: one funscript on its way from the player to the carriage, every
     station running at once on the same clock. Facts as on /diagrams/#funscript:
     sent up to the 1000 ms horizon minus 100 ms ahead, a Valence STREAM over WebSocket,
     the hub admits the control owner's segments, Kinetic² on a 1 ms grid into a 128 ms
     strip, the LP core gets a speed and a 4 ms lease every 1 ms and sends A/B quadrature,
     motion state back at 50 Hz. The curve is real Kinetic² output (kinetic-data.js). -->
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1280" data-height="720" data-fps="30" data-no-timeline>
  <svg id="scene" class="clip" data-start="0" data-duration="12" data-track-index="0" data-no-timeline viewBox="0 0 1280 720"></svg>
</div>
<script src="kinetic-data.js"></script>
<script src="common.js"></script>
<script src="screen-to-rail.js"></script>
</body>
</html>
