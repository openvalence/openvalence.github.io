<!doctype html>
<html lang="en" data-composition-variables='[{"id":"theme","type":"string","label":"Theme","default":"dark"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<meta name="robots" content="noindex">
<title>Screen to rail</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<!-- Screen to rail: one funscript on its way from the player to the carriage, every
     station running at once on the same clock. Facts as on /diagrams/#funscript:
     sent up to the 1000 ms horizon minus 100 ms ahead, a Valence STREAM over WebSocket,
     the hub admits the control owner's segments, Kinetic² on a 1 ms grid into a 128 ms
     strip, the LP core gets a speed and a 4 ms lease every 1 ms and sends A/B quadrature,
     motion state back at 50 Hz. The curve is real Kinetic² output (kinetic-data.js). -->
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1280" data-height="720" data-fps="30" data-no-timeline>
  <svg id="scene" class="clip" data-start="0" data-duration="12" data-track-index="0" data-no-timeline viewBox="0 0 1280 720"></svg>
</div>
<script src="kinetic-data.js"></script>
<script src="common.js"></script>
<script>
const DUR = 12, OFFSET = 1;   // frame 0 is the poster: start where the picture is whole
const S = KDATA.stroke, PER = 4;
const AHEAD = 0.9, WIRE = 0.4;         // sent 900 ms ahead; the wire leg is drawn slow enough to see
const W = 220, H = 168, PX = (i) => 32 + i * 244, PY = 188;
const P = (t) => S.P[Math.round((((t % PER) + PER) % PER) * 1000)];
// every action from one period before the loop to one after, so look-ahead wraps clean
const ACTS = [];
for (let n = -1; n <= DUR / PER + 1; n++) for (const [at, p] of S.knots) ACTS.push({ at: n * PER + at, p });
const ST = [
  ['01', 'Player', 'an action: a time,', 'a position'],
  ['02', 'Wire', 'Valence STREAM', 'over WebSocket'],
  ['03', 'Hub', 'control owner only,', 'each held until due'],
  ['04', 'Kinetic²', '1 ms grid,', '128 ms strip'],
  ['05', 'LP core', 'a speed + 4 ms lease', 'every 1 ms, A/B out'],
];
let g = {};

function panel(s, i) {
  const x = PX(i);
  const num = el('text', { x, y: 168, class: 'mono', 'font-size': 18, fill: C.accentInk }, s); num.textContent = ST[i][0];
  const tt = el('text', { x: x + 34, y: 170, class: 'kick', 'font-size': 26, fill: C.ink }, s); tt.textContent = ST[i][1];
  const box = el('rect', { x, y: PY, width: W, height: H, rx: 10, fill: C.bg2, stroke: C.rule, 'stroke-width': 1.5 }, s);
  el('text', { x, y: 388, class: 'mono', 'font-size': 16, fill: C.ink2 }, s).textContent = ST[i][2];
  el('text', { x, y: 410, class: 'mono', 'font-size': 16, fill: C.ink2 }, s).textContent = ST[i][3];
  const defs = el('defs', {}, s), cp = el('clipPath', { id: 'c' + i }, defs);
  el('rect', { x: 0, y: 0, width: W, height: H, rx: 10 }, cp);
  const inner = el('g', { transform: `translate(${x} ${PY})`, 'clip-path': `url(#c${i})` }, s);
  if (i < 4) el('path', { d: `M${x + W + 8} ${PY + H / 2 - 7}l7 7-7 7`, fill: 'none', stroke: C.ink3, 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s);
  return { box, tt, inner };
}
const small = (p, x, y, s, anchor = 'start', fill = C.ink3) => { const e = el('text', { x, y, class: 'mono', 'font-size': 12, fill, 'text-anchor': anchor }, p); e.textContent = s; return e; };

function setup() {
  const s = document.getElementById("scene");
  el('rect', { width: 1280, height: 720, fill: C.bg }, s);
  g.p = ST.map((_, i) => panel(s, i));
  // 01 player: the script scrolling past a playhead, the send line 900 ms ahead
  let q = g.p[0].inner;
  g.script = el('polyline', { fill: 'none', stroke: C.ink2, 'stroke-width': 2 }, q);
  g.pdots = ACTS.map(() => el('circle', { r: 4.5, 'stroke-width': 2 }, q));
  el('line', { x1: 52, x2: 52, y1: 12, y2: 156, stroke: C.ink, 'stroke-width': 2 }, q);
  el('line', { x1: 127, x2: 127, y1: 24, y2: 156, stroke: C.accentInk, 'stroke-width': 2, 'stroke-dasharray': '4 4' }, q);
  small(q, 56, 160, 'now'); small(q, 131, 34, 'send', 'start', C.accentInk);
  // 02 wire
  q = g.p[1].inner;
  el('line', { x1: 0, x2: W, y1: 92, y2: 92, stroke: C.line3, 'stroke-width': 2 }, q);
  small(q, W / 2, 40, 'STREAM', 'middle');
  g.pk = ACTS.map(() => { const e = el('g', {}, q); el('rect', { x: -17, y: -12, width: 34, height: 24, rx: 4, fill: C.accent }, e); el('rect', { x: -17, y: -12, width: 9, height: 24, rx: 2, fill: '#fff', opacity: 0.85 }, e); return e; });
  // 03 hub: what it holds, by how far ahead (now .. +1 s)
  q = g.p[2].inner;
  el('line', { x1: 14, x2: 206, y1: 118, y2: 118, stroke: C.line3, 'stroke-width': 2 }, q);
  el('line', { x1: 14, x2: 14, y1: 40, y2: 126, stroke: C.ink, 'stroke-width': 2 }, q);
  small(q, 14, 146, 'now'); small(q, 206, 146, '+1 s', 'end');
  g.hq = ACTS.map(() => el('rect', { y: 0, width: 10, height: 0, rx: 2, fill: C.accentInk }, q));
  g.ok = ACTS.map(() => el('circle', { r: 0, fill: 'none', stroke: C.accentInk, 'stroke-width': 2 }, q));
  // 04 Kinetic²: the curve around now, the 128 ms strip ahead of it
  q = g.p[3].inner;
  g.strip = el('rect', { x: 117, y: 0, width: (0.128 / 0.6) * 200, height: H, fill: C.accent, opacity: 0.22 }, q);
  small(q, 121, 18, '128 ms', 'start', C.accentInk);
  g.kpast = el('path', { fill: 'none', stroke: C.accentInk, 'stroke-width': 3.5, 'stroke-linecap': 'round' }, q);
  g.kstrip = el('path', { fill: 'none', stroke: C.accentInk, 'stroke-width': 6, 'stroke-linecap': 'round' }, q);
  g.kfut = el('path', { fill: 'none', stroke: C.line3, 'stroke-width': 2, 'stroke-dasharray': '3 4' }, q);
  g.kdots = ACTS.map(() => el('circle', { r: 4.5, fill: C.bg2, stroke: C.ink, 'stroke-width': 2 }, q));
  el('line', { x1: 117, x2: 117, y1: 12, y2: 156, stroke: C.ink, 'stroke-width': 2 }, q);
  // 05 LP core: A and B, the last 300 ms
  q = g.p[4].inner;
  small(q, 12, 58, 'A'); small(q, 12, 128, 'B');
  g.qa = el('path', { fill: 'none', stroke: C.accentInk, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, q);
  g.qb = el('path', { fill: 'none', stroke: C.ink2, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, q);
  // what comes back
  g.back = el('line', { x1: 1248, x2: 40, y1: 446, y2: 446, stroke: C.info, 'stroke-width': 2, 'stroke-dasharray': '6 10' }, s);
  el('path', { d: 'M46 439l-8 7 8 7', fill: 'none', stroke: C.info, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s);
  el('text', { x: 32, y: 478, class: 'mono', 'font-size': 16, fill: C.info }, s).textContent = 'motion state back to the app, 50 Hz';
  // the rail, on the accent
  el('rect', { y: 500, width: 1280, height: 220, fill: C.accent }, s);
  g.railLbl = el('text', { x: 48, y: 572, class: 'kick', 'font-size': 26, fill: '#fff' }, s);
  g.railLbl.textContent = 'Servo drive, motor, rail';
  el('rect', { x: 48, y: 640, width: 1184, height: 12, rx: 6, fill: '#fff', opacity: 0.28 }, s);
  for (let i = 0; i <= 10; i++) el('line', { x1: 96 + i * 108.8, x2: 96 + i * 108.8, y1: 666, y2: 676, stroke: '#fff', 'stroke-width': 2, opacity: 0.45 }, s);
  g.car = el('rect', { y: 624, width: 96, height: 44, rx: 8, fill: '#fff' }, s);
  // the band and the headline
  el('rect', { width: 1280, height: 104, fill: C.accent }, s);
  el('text', { x: 48, y: 76, class: 'disp', 'font-size': 58, fill: '#fff' }, s).textContent = 'Screen to rail.';
  el('text', { x: 1232, y: 70, 'text-anchor': 'end', class: 'kick', 'font-size': 16, fill: '#fff', opacity: 0.85 }, s).textContent = 'One script, start to finish';
}

const path = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');

function draw(t) {
  // a slow spotlight walks the stations, then the rail
  const spot = (t / 2) % 6;
  g.p.forEach((p, i) => {
    const w = clamp(1 - Math.abs(spot - i - 0.5) * 1.3 + 0.3);
    p.box.setAttribute('stroke', w > 0.5 ? C.accentInk : C.rule);
    p.box.setAttribute('stroke-width', 1.5 + 1.5 * w);
  });
  g.railLbl.setAttribute('opacity', spot >= 5 ? 1 : 0.8);
  // 01 player: 200 px over 2.4 s, from 0.5 s back
  const PXs = 200 / 2.4, px = (at) => 10 + (at - t + 0.5) * PXs, py = (p) => 150 - p * 130;
  const vis = ACTS.filter((a) => a.at > t - 0.9 && a.at < t + 2.3);
  g.script.setAttribute('points', vis.map((a) => px(a.at).toFixed(1) + ',' + py(a.p).toFixed(1)).join(' '));
  ACTS.forEach((a, i) => {
    const d = g.pdots[i], sent = a.at - AHEAD <= t;
    d.setAttribute('cx', px(a.at)); d.setAttribute('cy', py(a.p));
    d.setAttribute('fill', sent ? C.accentInk : C.bg2); d.setAttribute('stroke', sent ? C.accentInk : C.ink2);
    // 02 the wire leg
    const u = (t - (a.at - AHEAD)) / WIRE;
    g.pk[i].setAttribute('transform', `translate(${(-20 + u * 260).toFixed(1)} 92)`);
    g.pk[i].setAttribute('opacity', u >= 0 && u <= 1 ? 1 : 0);
    // 03 held by the hub until its time
    const ahead = a.at - t, held = u > 1 && ahead >= 0;
    const hx = 14 + ahead * 192;
    g.hq[i].setAttribute('x', hx - 5); g.hq[i].setAttribute('y', 118 - 18 - a.p * 56); g.hq[i].setAttribute('height', held ? 18 + a.p * 56 : 0);
    const k = clamp((u - 1) * WIRE / 0.35);
    g.ok[i].setAttribute('cx', hx); g.ok[i].setAttribute('cy', 118 - 18 - a.p * 56);
    g.ok[i].setAttribute('r', held && k < 1 ? 6 + 16 * out(k) : 0); g.ok[i].setAttribute('opacity', 1 - k);
    // 04 knots on the planner's window
    const kx = 117 + (a.at - t) * (200 / 0.6);
    g.kdots[i].setAttribute('cx', kx); g.kdots[i].setAttribute('cy', py(S.solved[i % S.knots.length].p));
    g.kdots[i].setAttribute('opacity', u > 1 && kx > -10 && kx < 230 ? 1 : 0);
  });
  // 04 the curve: past, the 128 ms strip, then planned ahead
  const kp = (dt) => [117 + dt * (200 / 0.6), py(P(t + dt))];
  const seg = (a, b) => { const r = []; for (let d = a; d <= b + 1e-9; d += 0.004) r.push(kp(d)); return path(r); };
  g.kpast.setAttribute('d', seg(-0.36, 0)); g.kstrip.setAttribute('d', seg(0, 0.128)); g.kfut.setAttribute('d', seg(0.128, 0.32));
  // 05 quadrature: the counts are the position
  const qa = [], qb = [];
  for (let i = 0; i <= 600; i++) {
    const tt = t - 0.3 + i * 0.0005, c = P(tt) * 12, x = 24 + i * (186 / 600);
    const A = (((c % 1) + 1) % 1) < 0.5, B = ((((c + 0.25) % 1) + 1) % 1) < 0.5;
    const ya = A ? 34 : 70, yb = B ? 104 : 140;
    if (i && qa[qa.length - 1][1] !== ya) qa.push([x, qa[qa.length - 1][1]]);
    if (i && qb[qb.length - 1][1] !== yb) qb.push([x, qb[qb.length - 1][1]]);
    qa.push([x, ya]); qb.push([x, yb]);
  }
  g.qa.setAttribute('d', path(qa)); g.qb.setAttribute('d', path(qb));
  g.back.setAttribute('stroke-dashoffset', (-t * 64).toFixed(1));
  g.car.setAttribute('x', 48 + P(t) * (1184 - 96));
}

run(setup, (t) => draw((t + OFFSET) % DUR), DUR);
</script>
</body>
</html>
