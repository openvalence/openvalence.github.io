<!doctype html>
<html lang="en" data-composition-variables='[{"id":"theme","type":"string","label":"Theme","default":"dark"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<meta name="robots" content="noindex">
<title>Any app, one machine</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<!-- Any app, one machine: the machine sends its catalog, three apps draw their own
     controls from the same entries, then one change syncs to all of them.
     Entries as Nucleus flagship_p4/src/hub/ValenceCatalog.h declares them (group
     "Pattern": speed, depth, stroke, % 0 to 100; group "Jog limits": jog_speed,
     mm/s, 1 to 2000). The desktop face is Phosphor's Dash (/images/phosphor/dash-*.webp),
     whose Pattern speed slider is that same entry. -->
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1280" data-height="720" data-fps="30" data-no-timeline>
  <svg id="scene" class="clip" data-start="0" data-duration="12" data-track-index="0" data-no-timeline viewBox="0 0 1280 720"></svg>
</div>
<script src="common.js"></script>
<script src="any-app.js"></script>
</body>
</html>
